name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run build

      - name: Inspect the publishable tarball
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination "$PWD/artifacts"
          ls -la artifacts

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: bitsnap-payloadcms
          path: artifacts/*.tgz
          if-no-files-found: error
